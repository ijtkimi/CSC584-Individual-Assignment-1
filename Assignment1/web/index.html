<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>Personal Profile</h1>
    <p class="subtitle">Please fill in your personal information</p>

    <form action="profile" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>

        <label for="studentId">Student ID:</label>
        <input type="text" id="studentId" name="studentId"
               placeholder="Enter your student ID" required>

        <label for="programme">Programme:</label>
        <input type="text" id="programme" name="programme"
               placeholder="Enter your programme" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="hobbies">Hobbies:</label>
        <input type="text" id="hobbies" name="hobbies"
               placeholder="Enter your hobbies" required>

        <label for="introduction">Self-Introduction:</label>
        <textarea id="introduction" name="introduction"
                  rows="5" placeholder="Tell me about yourself..."
                  required></textarea>
        
         <button type="submit">Submit Profile</button>
        
    </form>
</div>
</body>
</html>
